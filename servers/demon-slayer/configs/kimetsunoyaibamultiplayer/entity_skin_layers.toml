
#Entity 3D Skin Layer Configuration
#Translations use model units; 0.0625 is approximately one model pixel.
#Rotations are in degrees and are applied after the GeckoLib bone transform.
[entity_skin_layers]

	#Head / hat layer offsets
	[entity_skin_layers.head]
		#Local X translation in model units
		#Range: -5.0 ~ 5.0
		translate_x = 0.0
		#Local Y translation in model units
		#Range: -5.0 ~ 5.0
		translate_y = 1.5
		#Local Z translation in model units
		#Range: -5.0 ~ 5.0
		translate_z = 0.0
		#Local X rotation in degrees
		#Range: -360.0 ~ 360.0
		rotate_x = 0.0
		#Local Y rotation in degrees
		#Range: -360.0 ~ 360.0
		rotate_y = 0.0
		#Local Z rotation in degrees
		#Range: -360.0 ~ 360.0
		rotate_z = 180.0

	#Torso / jacket layer offsets
	[entity_skin_layers.torso]
		#Local X translation in model units
		#Range: -5.0 ~ 5.0
		translate_x = 0.0
		#Local Y translation in model units
		#Range: -5.0 ~ 5.0
		translate_y = 1.6
		#Local Z translation in model units
		#Range: -5.0 ~ 5.0
		translate_z = 0.0
		#Local X rotation in degrees
		#Range: -360.0 ~ 360.0
		rotate_x = 0.0
		#Local Y rotation in degrees
		#Range: -360.0 ~ 360.0
		rotate_y = 0.0
		#Local Z rotation in degrees
		#Range: -360.0 ~ 360.0
		rotate_z = 180.0

