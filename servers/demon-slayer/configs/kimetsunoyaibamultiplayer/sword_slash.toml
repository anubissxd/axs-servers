	#
	#360-degree spin attack
	#Animation: sword_rotate
	[advanced.sword_rotate]
		#Yaw offset for spin attack (degrees)
		#Default: -90
		#Range: -180.0 ~ 180.0
		yaw_offset = -90.0
		#Pitch angle for spin attack (degrees)
		#Default: 0
		#Range: -180.0 ~ 180.0
		pitch = 0.0
		#Roll angle for spin attack (degrees)
		#Default: 0
		#Range: -180.0 ~ 180.0
		roll = 0.0
		#Arc angle offset for spin attack (degrees)
		#Default: 50
		#Range: -180.0 ~ 180.0
