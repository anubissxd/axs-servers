		#Pitch angle for upward slash (degrees)
		#Default: 90
		#Range: -180.0 ~ 180.0
		pitch = 90.0
		#Roll angle for upward slash (degrees)
		#Default: 90
		#Range: -180.0 ~ 180.0
		roll = 90.0
		#Arc angle offset for upward slash (degrees)
		#Default: 0
		#Range: -180.0 ~ 180.0
		arc_offset = 0.0
		#Radius multiplier for upper slash
		#Default: 1
		#Range: -5.0 ~ 5.0
